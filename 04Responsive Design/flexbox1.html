<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Pare che di default la flexbox organizza orizzontalmente gli elementi*/
        .container{
            display:flex;
        }
        .container>div{
            border: solid 1px;
        }

        /*Il secondo elemento cresce 2 volte di più rispetto al primo; il terzo elemento cresce 3 volte di più sempre rispetto al primo*/
        .container>div:nth-child(1){flex-grow:1;}
        .container>div:nth-child(2){flex-grow:2;}
        .container>div:nth-child(3){flex-grow:3;}
    </style>
</head>
<body>
    <div class="container">
        <div>Lorem ipsum dolor sic totem mostrus</div>
        <div>Lorem ipsum dolor sic totem mostrus</div>
        <div>Lorem ipsum dolor sic totem mostrus</div>        
    </div>
</body>
</html>
