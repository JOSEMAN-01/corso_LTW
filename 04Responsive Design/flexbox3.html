<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{margin:0px;}
        .container{
            display:flex;
        }
        .container>div{
            border: solid 1px;
        }
        .container>div:nth-child(1){flex: 2 0 300px; background-color: red;}/*Questo elemento cresce con un tasso 2, non si rimpicciolisce, e la sua dimensione di base è di 300px */
        .container>div:nth-child(2){flex: 1 1 300px; background-color: yellow;}
        .container>div:nth-child(3){flex: 0 2 300px; background-color: blue;}
    </style>
</head>
<body>
    <div class="container">
        <div>111111</div>
        <div>222222</div>
        <div>333333</div>
    </div>
</body>
</html>
