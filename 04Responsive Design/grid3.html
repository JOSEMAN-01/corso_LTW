<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:grid;
            grid-template:
                '. . .' 100px
                '. . .' 50px
                '. . .' 100px/100px 1fr 4fr
        }

        .container > div {
            border: solid 1px;
        }

        .container>div:nth-child(1){grid-area: 1/1/3/3;} 
        /*Ci sono delle linee invisibili tra gli elementi del grid
        Questo shortcut le prende in considerazione, e va ad assegnare uno spazio che val punto (1,1)
        fino al punto (3,3)
        Questo equivale allo spazio tra la riga 1 colonna 1 fino alla riga 2 colonna 2*/
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>
