<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio1</title>
    <script>
        const TENNIS_PREZZO_CAMPO=100;
        const CALCIO_PREZZO_CAMPO=70;
        const TENNIS_NUM_GIOCATORI=2;
        const CALCIO_NUM_GIOCATORI=10;

        var numGiocatoriChanged=false;

        function stopAutocomplete(){
            numGiocatoriChanged=true;
        }

        function popolaCampi(){
                var prezzoCampo;
                var sportScelto=document.formPrenotaCampo.sport.value;
                if(sportScelto==="tennis") {
                    document.formPrenotaCampo.prezzoCampo.value=TENNIS_PREZZO_CAMPO;
                    if(!numGiocatoriChanged) formPrenotaCampo.numGiocatori.value=TENNIS_NUM_GIOCATORI;
                    prezzoCampo=TENNIS_PREZZO_CAMPO;
                }
                if(sportScelto==="calcio"){
                    document.formPrenotaCampo.prezzoCampo.value=CALCIO_PREZZO_CAMPO;
                    if(!numGiocatoriChanged) formPrenotaCampo.numGiocatori.value=CALCIO_NUM_GIOCATORI;
                    prezzoCampo=CALCIO_PREZZO_CAMPO;
                }
                var tempo=document.formPrenotaCampo.tempo.value;
                var numGiocatori=document.formPrenotaCampo.numGiocatori.value;
                if(tempo&&numGiocatori){
                    var x=(prezzoCampo*tempo)/(numGiocatori*60);
                    document.formPrenotaCampo.prezzoGiocatore.value=x.toFixed(1);
                }
        }

        function customReset(){
            document.formPrenotaCampo.reset();
            document.getElementById("dataOraPrenotazione").valueAsDate=new Date();
        }

        function validaForm(){
            var form=document.formPrenotaCampo;
            if(form.numGiocatori.value==""||form.sceltaContatto.checked==false||form.dataOraPrenotazione.value==""){
                alert("Compilare i campi del 'Numero Giocatori','Contatto preferito' e 'Data e ora'");
                return false;
            }
            
            
        }

        window.addEventListener("load",()=>{
            document.getElementById("dataOraPrenotazione").valueAsDate=new Date();
            popolaCampi();
        });

    </script>
</head>
<body>
    <form name="formPrenotaCampo" action="" method="post" onsubmit="return validaForm();">
        Nome:
        <input type="text" name="nome" id="nome" size="50" maxlength="50" placeholder="Mario Rossi"><br>
        Numero di giocatori:
        <input type="number" name="numGiocatori" id="numGiocatori" min="1" onkeyup="stopAutocomplete()"><br>
        Email:
        <input type="email" name="email" id="email"><br>
        Telefono:
        <input type="tel" name="telefono" id="telefono"><br>
        Contatto preferito:
        <input type="radio" name="sceltaContatto" id="sceltaContatto1" value="telefono">telefono
        <input type="radio" name="sceltaContatto" id="sceltaContatto2" value="email">email
        <br>
        Data e ora:
        <input type="datetime-local" name="dataOraPrenotazione" id="dataOraPrenotazione"><br>
        Sport:
        <select name="sport" id="sport" onchange="popolaCampi();">    
            <option value="calcio" selected>Calcio</option>
            <option value="tennis">Tennis</option>
        </select>
        <br>
        Tempo (in minuti):
        <input type="number" name="tempo" id="tempo" onkeyup="popolaCampi();" min="1"><br>
        Prezo (euro/ora):
        <input type="number" name="prezzoCampo" id="prezzoCampo" ><br>
        Prezzo per Giocatore (euro/ora)
        <input type="number" name="prezzoGiocatore" id="prezzoGiocatore" readonly><br>
        <input type="checkbox" name="includeDivise" id="includeDivise">
        Includere divise/casacche?
        <br>
        <input type="submit" value="Prenota">
        <input type="button" value="Reset" onclick="customReset();">

    </form>
</body>
</html>
