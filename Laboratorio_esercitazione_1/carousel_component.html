<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.css">
    <script src="./bootstrap/js/bootstrap.bundle.js"></script>
    <title>Carousel component</title>
</head>
<body class="text-center">
    <div id="myCarousel" class="carousel carousel-fade w-75 m-auto" data-bs-ride="carousel" data-bs-theme="dark">
        <div class="carousel-indicators">
            <button data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
            <button data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
            <button data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active"> <img src="./immagini/paris1.jpg" ></div>
            <div class="carousel-item"> <img src="./immagini/paris2.jpg" ></div>
            <div class="carousel-item"> <img src="./immagini/paris3.jpg" ></div>
        </div>
        <!-- Ora definiamo le frecce ai lati per scorrere il carousel-->
        <button class="carousel-control-prev" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
    
</body>
</html>
