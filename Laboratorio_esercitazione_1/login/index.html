<head>

    <title>Login Page</title>

<body class="text-center">
    <!-- Per qualche motivo dobbiamo aggiungere la classe 'm-auto' per centrare la pagina-->

        <!-- mb sta per margin bottom-->
        <h1 class="mb-4">Loggati!</h1>
        <!---->
        <input type="email" name="email" id="" placeholder="Inserisci la tua email" class="form-control" required autofocus>
        <input type="password" name="password" id="" placeholder="Inserisci la tua password" class="form-control" required>
        <div id="divRemember" class="checkbox mb-2">
            <input type="checkbox" name="rmb" id="remember">
            <label for="remember">Remember me</label>
        </div>
        <br>
        <br>
        <button type="submit" class="btn btn-primary">Invia!</button> 
    </form>
